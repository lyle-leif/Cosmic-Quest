[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"

  testImplementation platform('org.junit:junit-bom:5.11.3')
  testImplementation 'org.junit.jupiter:junit-jupiter'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

test {
  useJUnitPlatform()
  testLogging {
    events "failed"
    exceptionFormat "full"
  }
}

// Plays the console version: .\gradlew core:runConsole -q --console=plain
// standardInput passes the keyboard through; without it the Scanner gets no input.
tasks.register('runConsole', JavaExec) {
  group = 'application'
  description = 'Runs the console version of Cosmic Quest.'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'com.neurolink.cosmicquest.console.ConsoleMain'
  standardInput = System.in
  workingDir = rootProject.projectDir
}
